name: CI

on:
  push:
    branches: [main, homologacao]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        environment: [homologacao, production]
    runs-on: ubuntu-latest
    env:
      PUBLIC_DEPLOY_ENV: ${{ matrix.environment }}
      PUBLIC_SITE_URL: https://aratuconverter.com
      PUBLIC_GA_MEASUREMENT_ID: G-N537RC2ESS
      PUBLIC_ADSENSE_CLIENT_ID: ca-pub-6553617658503206
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:seo
